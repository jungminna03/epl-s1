<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" width="200" height="200">
  <!-- 10x10 grid, each cell = 1 unit. Black squares on white. -->
  <rect width="10" height="10" fill="black"/>
  <!-- Cut out white areas by drawing white rects -->
  <!-- Top-right white square -->
  <rect x="8" y="0" width="2" height="2" fill="white"/>

  <!-- Row 0-1: top section gaps -->
  <!-- Gap between top-left blocks -->
  <rect x="2" y="0" width="1" height="1" fill="white"/>
  <rect x="4" y="0" width="1" height="2" fill="white"/>

  <!-- Upper left maze area (rows 0-4) -->
  <!-- Row 0 -->
  <rect x="1" y="1" width="1" height="1" fill="white"/>
  <rect x="3" y="1" width="1" height="1" fill="white"/>

  <!-- Row 2 -->
  <rect x="0" y="2" width="1" height="1" fill="white"/>
  <rect x="2" y="2" width="2" height="1" fill="white"/>

  <!-- Row 3 -->
  <rect x="1" y="3" width="2" height="1" fill="white"/>
  <rect x="4" y="2" width="1" height="2" fill="white"/>

  <!-- Row 4 - horizontal gap -->
  <rect x="0" y="4" width="5" height="1" fill="white"/>

  <!-- Upper right area (rows 0-4) -->
  <rect x="5" y="0" width="3" height="1" fill="white"/>
  <rect x="5" y="1" width="1" height="1" fill="white"/>
  <rect x="7" y="1" width="1" height="3" fill="white"/>
  <rect x="5" y="2" width="2" height="2" fill="white"/>
  <rect x="5" y="4" width="5" height="1" fill="white"/>
  <rect x="9" y="1" width="1" height="3" fill="white"/>

  <!-- Lower left area (rows 5-9) -->
  <rect x="0" y="5" width="1" height="2" fill="white"/>
  <rect x="2" y="5" width="3" height="1" fill="white"/>
  <rect x="2" y="6" width="1" height="1" fill="white"/>
  <rect x="4" y="6" width="1" height="1" fill="white"/>
  <rect x="0" y="7" width="2" height="1" fill="white"/>
  <rect x="3" y="7" width="2" height="1" fill="white"/>
  <rect x="0" y="8" width="1" height="2" fill="white"/>
  <rect x="2" y="8" width="3" height="2" fill="white"/>

  <!-- Lower right area (rows 5-9) - vertical stripes -->
  <rect x="6" y="5" width="1" height="5" fill="white"/>
  <rect x="8" y="5" width="1" height="5" fill="white"/>
</svg>