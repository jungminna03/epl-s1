appId: app.epl.signage
productName: EPL 공지사항
copyright: Copyright © 2026 Emotive Play

directories:
  output: release
  buildResources: electron-resources

# 패키지에 들어가는 것 — 컴파일된 main/preload만.
files:
  - dist-electron/**/*
  - package.json

# 위젯은 원격 URL을 로드하므로 Next.js 산출물(.next)은 번들에 포함하지 않음.

# resources/ 로 카피되는 것 — runtime 에 process.resourcesPath 로 접근.
extraResources:
  - from: electron-resources/icon.ico
    to: icon.ico

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron-resources/icon.ico
  # ASCII 파일명 — GitHub Actions Windows runner 의 gh release upload 가
  # 한글 파일명을 점(.)으로 mangling 하는 인코딩 이슈 회피.
  # 설치 시 UI 표시명(productName: "EPL 공지사항") 은 그대로 유지.
  artifactName: EPL-Notice-Setup-${version}.${ext}
  forceCodeSigning: false
  verifyUpdateCodeSignature: false

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  deleteAppDataOnUninstall: true
  shortcutName: EPL 공지사항
  installerIcon: electron-resources/icon.ico
  uninstallerIcon: electron-resources/icon.ico

# 자동 업데이트 — GitHub Releases (public repo, 무료, 무제한 다운로드).
# generic provider 유지 — releases/latest/download URL 이 정적 파일 서버 패턴 그대로 동작.
publish:
  - provider: generic
    url: https://github.com/jungminna03/epl-s1/releases/latest/download
    channel: latest
